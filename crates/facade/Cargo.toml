[package]
name = "colorless"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
colorless-core = { workspace = true }
colorless-rt = { workspace = true }
colorless-std = { workspace = true, optional = true }
colorless-macros = { workspace = true }

[features]
default = ["std", "autocomplete", "desugar-resolve", "color-impl"]

# Compiler features
relaxed-drop = ["colorless-macros/relaxed-drop"]
autocomplete = ["colorless-macros/autocomplete", "colorless-std/autocomplete"]
desugar-resolve = ["colorless-macros/desugar-resolve"]
no-wrap = ["colorless-macros/no-wrap"]
out-of-my-way = ["colorless-macros/out-of-my-way"]
color-impl = ["colorless-macros/color-impl"]

# std & core features
alloc = ["colorless-core/alloc", "colorless-rt/alloc", "colorless-std?/alloc"]
rainbow = ["colorless-core/rainbow"]
std = ["colorless-core/std", "colorless-rt/std", "dep:colorless-std", "colorless-std/std"]
futures-io = ["colorless-std/futures-io"]
tokio = ["colorless-std/tokio"]
nightly = ["colorless-std/nightly"]
unstable = ["colorless-std/unstable"]

# Dev features
compiler-cliff-probe = []

[dev-dependencies]
trybuild = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
tokio = { version = "1.37", features = ["full"] }

[[bench]]
name = "branch"
path = "benches/branch.rs"
harness = false
required-features = ["relaxed-drop"]

[[bench]]
name = "cps"
path = "benches/cps.rs"
harness = false
required-features = ["relaxed-drop"]

[[bench]]
name = "loops"
path = "benches/loops.rs"
harness = false
required-features = ["relaxed-drop"]

[[bench]]
name = "one_of_4"
path = "benches/one_of_4.rs"
harness = false
required-features = ["relaxed-drop"]

[[bench]]
name = "one_of_12"
path = "benches/one_of_12.rs"
harness = false
required-features = ["relaxed-drop"]

[[example]]
name = "simple_pipeline"
path = "examples/simple_pipeline.rs"
required-features = ["relaxed-drop"]

[[example]]
name = "retry_with_fallback"
path = "examples/retry_with_fallback.rs"
required-features = ["relaxed-drop"]

[[example]]
name = "stream_parser"
path = "examples/stream_parser.rs"
required-features = ["relaxed-drop"]
