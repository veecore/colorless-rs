[workspace]
members = [
    "crates/runtime/*",
    "crates/compiler/*",
    "crates/facade",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Victor <123157458+veecore@users.noreply.github.com>"]

[workspace.dependencies]
# Runtime crates
cps-signal = { path = "crates/runtime/signal", version = "0.1.0" }
cps-try = { path = "crates/runtime/try", version = "0.1.0" }
colorless-core = { path = "crates/runtime/core", version = "0.1.0" }
colorless-std = { path = "crates/runtime/std", version = "0.1.0" }

# Compiler & macro crates
colorless-prepare = { path = "crates/compiler/prepare", version = "0.1.0" }
colorless-cps = { path = "crates/compiler/cps", version = "0.1.0" }
colorless-macros = { path = "crates/compiler/macros", version = "0.1.0" }

# Public facade crate
colorless = { path = "crates/facade", version = "0.1.0" }

# External AST & compiler tooling
syn = { version = "3.0.4", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

# Benchmarking & Testing
criterion = "0.8.2"
tokio = { version = "1.37", features = ["full"] }

[workspace.lints.rust]
unused_must_use = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }
