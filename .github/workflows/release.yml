name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Crate to publish (or "all" to publish all unpublished workspace crates)'
        type: choice
        default: 'all'
        options:
          - all
          - cps-signal
          - cps-try
          - colorless-core
          - colorless-lower
          - colorless-rt
          - colorless-codegen
          - colorless-macros
          - colorless-std
          - colorless
      dry_run:
        description: 'Dry run (do not publish to crates.io or create release)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Quality Gate ────────────────────────────────────────────────────────
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Run workspace tests
        run: cargo test --workspace --features="relaxed-drop"

  # ── 2. Publish to crates.io & GitHub Release ───────────────────────────────
  publish:
    name: Publish to Crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set or empty in GitHub Secrets!"
            echo "Please check: Repo Settings -> Secrets and variables -> Actions -> Repository secrets -> CARGO_REGISTRY_TOKEN"
            exit 1
          fi

          DRY_RUN="${{ inputs.dry_run }}"
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in DRY RUN mode"
          fi

          PACKAGE="${{ inputs.package || 'all' }}"

          if [ "$PACKAGE" != "all" ]; then
            echo "Publishing single crate: $PACKAGE"
            cargo publish -p "$PACKAGE" $DRY_RUN_FLAG
            exit 0
          fi

          # Auto-exclude crates whose current version is already on crates.io
          EXCLUDES=()
          PUBLISHABLE_COUNT=0
          EXCLUDED_COUNT=0

          while IFS=' ' read -r name version; do
            PUBLISHABLE_COUNT=$((PUBLISHABLE_COUNT + 1))
            if curl -sf -A "colorless-rs-ci" "https://crates.io/api/v1/crates/$name/$version" -o /dev/null; then
              echo "Skipping $name v$version (already on crates.io)"
              EXCLUDES+=(--exclude "$name")
              EXCLUDED_COUNT=$((EXCLUDED_COUNT + 1))
            else
              echo "Queued $name v$version"
            fi
          done < <(
            cargo metadata --no-deps --format-version 1 | python3 -c "
          import sys, json
          for p in json.load(sys.stdin)['packages']:
              if p['publish'] is None or len(p['publish']) > 0:
                  print(p['name'], p['version'])
          "
          )

          if [ "$EXCLUDED_COUNT" -eq "$PUBLISHABLE_COUNT" ]; then
            echo "All $PUBLISHABLE_COUNT workspace crates are already published."
            exit 0
          fi

          cargo publish --workspace "${EXCLUDES[@]}" $DRY_RUN_FLAG
