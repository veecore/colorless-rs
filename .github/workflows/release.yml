name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish to crates.io or create release)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Quality Gate ────────────────────────────────────────────────────────
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Run workspace tests
        run: cargo test --workspace --features="relaxed-drop"

  # ── 2. Publish to crates.io & GitHub Release ───────────────────────────────
  publish:
    name: Publish to Crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sequentially Publish Crates to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run }}"
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in DRY RUN mode"
          fi

          # Ordered by dependency graph (leaves first, public facade last)
          CRATES=(
            "crates/library/signal"
            "crates/library/try"
            "crates/library/core"
            "crates/library/rt"
            "crates/compiler/lower"
            "crates/compiler/codegen"
            "crates/compiler/macros"
            "crates/library/std"
            "crates/facade"
          )

          for crate_dir in "${CRATES[@]}"; do
            echo "=========================================================="
            echo "Publishing: $crate_dir"
            echo "=========================================================="
            
            # Retry loop to handle crates.io index propagation delay
            MAX_ATTEMPTS=5
            ATTEMPT=1
            SUCCESS=false

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
              if cargo publish --package $(cargo metadata --manifest-path "$crate_dir/Cargo.toml" --no-deps --format-version 1 | jq -r '.packages[0].name') $DRY_RUN_FLAG; then
                SUCCESS=true
                break
              else
                echo "Publish failed. Waiting 20 seconds for crates.io index update..."
                sleep 20
                ATTEMPT=$((ATTEMPT + 1))
              fi
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "Failed to publish $crate_dir after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            # Crates.io index takes a short while to propagate for downstream dependents
            if [ "$DRY_RUN" != "true" ]; then
              echo "Waiting 25 seconds for crates.io index propagation..."
              sleep 25
            fi
          done

          echo "All crates published successfully!"
