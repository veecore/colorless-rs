name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      # `cargo check --tests` builds only metadata for the facade itself,
      # while its direct proc-macro integration tests must link that facade.
      # `cargo test --no-run` is the correct all-test-target build gate.
      - run: cargo check --workspace --lib --bins --examples --features="relaxed-drop"
      - run: cargo test --workspace --no-run --features="relaxed-drop"
      - run: cargo test --workspace --features="relaxed-drop"
      - run: cargo test -p colorless --test macro_contract --features="relaxed-drop"
      - run: cargo test -p colorless --test ui --features="relaxed-drop"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo doc --workspace --no-deps

  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly check -p colorless-std --features nightly
      - run: cargo +nightly miri test -p colorless-rt
